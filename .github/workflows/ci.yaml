name: CI

on:
  push:
    branches:
      - master
      - development
      - production

permissions:
  contents: read

env:
  CI: true

jobs:
  ci:
    uses: ./.github/workflows/node-ci.yml
    with:
      node-version: "24"
      artifact-name: react-build

  verify-artifact:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Inspect empty workspace
        run: |
          echo "Runner: ${{ runner.name }}"
          echo "Workspace before artifact download:"
          ls -la

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: react-build
          path: build

      - name: Inspect downloaded artifact
        run: |
          echo "Downloaded build:"
          ls -la build
          echo
          echo "Static files:"
          ls -la build/static

      - name: Calculate downloaded fingerprint
        run: |
          echo "SHA-256 of downloaded build/index.html:"
          sha256sum build/index.html

  deliver-development:
    needs: build
    if: github.ref_name == 'development'
    runs-on: ubuntu-latest
    environment: development

    env:
      DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: react-build
          path: build

      - name: Verify deployment configuration
        run: |
          echo "Deployment target: $DEPLOY_TARGET"

          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "ERROR: DEPLOY_TOKEN is missing"
            exit 1
          fi

          echo "DEPLOY_TOKEN is available"

      - name: Deliver to development
        run: |
          echo "Deploying artifact to $DEPLOY_TARGET"
          ls -la build

  deploy-production:
    needs: build
    if: github.ref_name == 'production'
    runs-on: ubuntu-latest
    environment: production

    env:
      DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: react-build
          path: build

      - name: Verify deployment configuration
        run: |
          echo "Deployment target: $DEPLOY_TARGET"

          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "ERROR: DEPLOY_TOKEN is missing"
            exit 1
          fi

          echo "DEPLOY_TOKEN is available"

      - name: Deploy to production
        run: |
          echo "Deploying artifact to $DEPLOY_TARGET"
          ls -la build

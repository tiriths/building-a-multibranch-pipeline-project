name: CI

on:
  push:
    branches:
      - master
      - development
      - production

  pull_request:
    branches:
      - master

env:
  CI: true

jobs:
  ci:
    uses: ./.github/workflows/node-ci.yml
    with:
      node-version: "24"
      artifact-name: react-build

  verify-artifact:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Inspect empty workspace
        run: |
          echo "Runner: ${{ runner.name }}"
          echo "Workspace before artifact download:"
          ls -la

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: react-build
          path: build

      - name: Inspect downloaded artifact
        run: |
          echo "Downloaded build:"
          ls -la build
          echo
          echo "Static files:"
          ls -la build/static

      - name: Calculate downloaded fingerprint
        run: |
          echo "SHA-256 of downloaded build/index.html:"
          sha256sum build/index.html

  deliver-development:
    needs: ci
    if: github.ref_name == 'development'
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: react-build
          path: build

      - name: Deliver to development
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Simulating delivery to DEVELOPMENT"
          echo
          echo "Artifact contents:"
          ls -la build

  deploy-production:
    needs: ci
    if: github.ref_name == 'production'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: react-build
          path: build

      - name: Deploy to production
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Simulating deployment to PRODUCTION"
          echo
          echo "Artifact contents:"
          ls -la build
